[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tutor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.136.3",
    "google-adk[extensions]>=2.1.0",
    "httpx>=0.28.1",
    "pydantic==2.12.5",
    "uvicorn>=0.48.0",
]

[project.scripts]
assistant = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
