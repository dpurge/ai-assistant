[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assistant"
version = "0.1.0"
description = "Language-tutor assistant built on Google ADK (FastAPI + Ollama)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "faiss-cpu>=1.8.0",
    "fastapi>=0.136.3",
    "google-adk[extensions]>=2.1.0",
    "httpx>=0.28.1",
    "jinja2>=3.1,<4",
    "markdown>=3.7,<4",
    "markupsafe>=2",
    "numpy>=1.26.0",
    "pydantic==2.12.5",
    "pydantic-settings>=2,<3",
    "uvicorn>=0.48.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.26,<1",
    "pytest-cov>=5,<7",
    "ruff>=0.14",
]
observability = [
    "langfuse>=3,<4",
]

[project.scripts]
assistant = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"app.lesson" = ["templates/*.j2"]
"app.canvas" = ["templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Prompts are long English sentences; wrapping them risks changing model behavior.
"src/app/agent/prompt.py" = ["E501"]
"src/app/agent/language/prompt.py" = ["E501"]
"src/app/agent/language/tutor.py" = ["E501"]
"src/app/agent/model.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source_pkgs = ["app"]
relative_files = true

[tool.coverage.report]
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]
